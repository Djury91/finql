repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # A ruff és a mypy a lockolt verzióval fut (uv run), így ugyanaz, mint a CI-ban.
  - repo: local
    hooks:
      - id: no-private-files
        name: a private/ mappa nem kerülhet commitba
        entry: a private/ mappa személyes jegyzeteket tartalmaz, nem commitolható
        language: fail
        files: ^private/
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
