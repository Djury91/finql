name: finql

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?add meg a POSTGRES_PASSWORD-ot a .env-ben}
      POSTGRES_DB: ${POSTGRES_DB:-finql}
    # A párhuzamos lekérdezések a /dev/shm-ben osztják meg a hash-táblákat. A Docker alapértéke
    # (64 MB) a large skálán egy nagy JOIN-nál „No space left on device” hibát adott.
    shm_size: 512mb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A PG18 image-ben a PGDATA verziózott alkönyvtár, ezért a szülőmappát csatoljuk.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
