name: finql

# `docker compose up`: adatbázis → előkészítés (setup) → alkalmazás, http://127.0.0.1:8000.
# A fejlesztéshez elég az adatbázis: `docker compose up -d --wait db` (poe db-up), az alkalmazás
# pedig a gépen fut (poe dev).
# Nyomkövetés: `docker compose --profile observability up -d jaeger`, és a .env-ben
# FINQL_OTEL_ENDPOINT=http://127.0.0.1:4318; a felület: http://127.0.0.1:16686 (ADR-014).

x-finql: &finql
  build: .
  image: finql:local
  env_file:
    - path: .env
      required: false
  environment:
    # A .env URL-jei a gépről (127.0.0.1) érik el az adatbázist; a konténerben ez a hoszt a
    # Compose-hálózat `db` neve (docker/entrypoint.sh). A jelszavak így egy helyen maradnak.
    FINQL_DB_HOST: db:5432
    # Konténerben JSON-log (a .env FINQL_ENV=dev értéke mellett is), felülírható a .env-ben.
    FINQL_LOG_JSON: ${FINQL_LOG_JSON:-true}
    # Ha a .env bekapcsolja a nyomkövetést (a gépről: 127.0.0.1:4318), a konténerből ugyanaz a
    # Jaeger a Compose-hálózat `jaeger` nevén érhető el. Üresen marad, ha a .env nem kapcsolja be.
    FINQL_OTEL_ENDPOINT: ${FINQL_OTEL_ENDPOINT:+http://jaeger:4318}

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?add meg a POSTGRES_PASSWORD-ot a .env-ben}
      POSTGRES_DB: ${POSTGRES_DB:-finql}
    # A párhuzamos lekérdezések a /dev/shm-ben osztják meg a hash-táblákat. A Docker alapértéke
    # (64 MB) a large skálán egy nagy JOIN-nál „No space left on device” hibát adott.
    shm_size: 512mb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A PG18 image-ben a PGDATA verziózott alkönyvtár, ezért a szülőmappát csatoljuk.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Egyszer fut le indításkor: szerepkörök, migrációk, adatok (ha még nincsenek), demófelhasználók,
  # dokumentumok. Minden lépése idempotens.
  setup:
    <<: *finql
    command: setup
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *finql
    command: serve
    ports:
      - "127.0.0.1:${FINQL_PORT:-8000}:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Nyomkövetés (OpenTelemetry): csak a profillal indul. OTLP/HTTP a 4318-as porton, a felület a
  # 16686-on. Memóriában tárol: újraindításkor a nyomok elvesznek, helyi nézegetőnek ennyi elég.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
