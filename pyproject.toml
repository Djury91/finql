[project]
name = "finql"
version = "0.1.0"
description = "Természetes nyelvű elemző asszisztens banki mintaadatokra: text-to-SQL, RAG és agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "faker>=40.43.0",
    "httpx2>=2.16.0",
    "fastapi>=0.162.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlglot>=30.25.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "tzdata>=2026.5",
]

[project.scripts]
finql = "finql.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finql"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ASYNC", "RUF"]
# A magyar szövegekben a gondolatjel (–) szándékos, nem elírt kötőjel.
allowed-confusables = ["–"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "integration: valódi Postgres-t indít (Docker kell hozzá)",
    "llm: a valódi Anthropic API-t hívja (API-kulcs kell, pénzbe kerül)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poe.tasks]
dev = { cmd = "uvicorn finql.main:create_app --factory --reload", help = "Fejlesztői szerver" }
db-up = { cmd = "docker compose up -d --wait db", help = "Postgres indítása" }
db-down = { cmd = "docker compose down", help = "Postgres leállítása (az adat megmarad)" }
db-bootstrap = { cmd = "finql db bootstrap", help = "DB-szerepkörök és jelszavak (adminnal, idempotens)" }
db-migrate = { cmd = "alembic upgrade head", help = "Migrációk futtatása" }
seed = { cmd = "finql seed --scale small", help = "Szintetikus banki adatok (small skála)" }
db-setup = { sequence = ["db-up", "db-bootstrap", "db-migrate", "seed"], help = "Üres gépről betöltött adatbázisig" }
lint = { cmd = "ruff check .", help = "Lint" }
format = { cmd = "ruff format .", help = "Formázás" }
typecheck = { cmd = "mypy", help = "Típusellenőrzés" }
test = { cmd = "pytest", help = "Minden teszt" }
test-unit = { cmd = "pytest -m \"not integration\"", help = "Tesztek Docker nélkül" }
test-llm = { cmd = "pytest -m llm", help = "A valódi Claude-dal futó tesztek (API-kulcs kell)" }
examples-sync = { cmd = "finql examples sync", help = "Few-shot példák betöltése (embeddinggel)" }
eval = { cmd = "finql eval run", help = "Eval a valódi modellel (API-kulcs kell, pénzbe kerül)" }
eval-oracle = { cmd = "finql eval run --llm oracle --no-save", help = "Az eval harness önellenőrzése, ingyen" }
ingest = { cmd = "finql ingest", help = "Dokumentumok betöltése (darabolás, embedding)" }
eval-retrieval = { cmd = "finql eval retrieval", help = "A dokumentumkeresés mérése (recall@5), LLM nélkül" }
check = { sequence = ["lint", { cmd = "ruff format --check ." }, "typecheck", "test"], help = "Amit a CI is futtat" }
